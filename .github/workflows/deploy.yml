name: CI and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: verify-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@4424c9aab975b57bd706ee5a39c6b4334d6e4f60 # 2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, zip
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install PHP dependencies
        run: |
          composer validate --strict --no-check-publish
          composer install --prefer-dist --no-interaction --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Run tests
        run: php artisan test --compact

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Install production PHP dependencies
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Package release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir _release
          rsync -a ./ _release/ \
            --exclude '/_release/' \
            --exclude '/.git/' \
            --exclude '/.github/' \
            --exclude '/.env*' \
            --exclude '/node_modules/' \
            --exclude '/tests/' \
            --exclude '/phpunit.xml' \
            --exclude '/AGENTS.md' \
            --exclude '/CLAUDE.md'

      - name: Upload release artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}
          path: _release
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      SFTP_HOST: home219122573.1and1-data.host
      SFTP_PORT: '22'
      SFTP_USERNAME: acc1729301641
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      SFTP_KNOWN_HOSTS: ${{ vars.SFTP_KNOWN_HOSTS }}

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.sha }}
          path: release

      - name: Install SFTP client
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp sshpass

      - name: Configure server identity
        run: |
          test -n "$SFTP_PASSWORD"
          test -n "$SFTP_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy over SFTP
        run: |
          lftp -u "$SFTP_USERNAME","$SFTP_PASSWORD" -p "$SFTP_PORT" "sftp://$SFTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          mkdir -p storage/app/private
          mkdir -p storage/app/public
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/cache/locks
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs
          mirror --reverse --verbose --parallel=4 \
            --exclude-glob .env \
            --exclude-glob 'storage/**' \
            --exclude-glob public/storage \
            --exclude-glob 'public/.well-known/**' \
            release/ ./
          bye
          LFTP

      - name: Run database migrations
        run: |
          SSHPASS="$SFTP_PASSWORD" sshpass -e ssh \
            -p "$SFTP_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$SFTP_USERNAME@$SFTP_HOST" '
              set -eu

              if [ -f "$HOME/questions/artisan" ]; then
                cd "$HOME/questions"
              elif [ -f "$HOME/artisan" ]; then
                cd "$HOME"
              else
                echo "Laravel application directory not found." >&2
                exit 1
              fi

              if [ -x /usr/bin/php8.4 ]; then
                php_binary=/usr/bin/php8.4
              elif [ -x /usr/bin/php8.4-cli ]; then
                php_binary=/usr/bin/php8.4-cli
              else
                echo "PHP 8.4 CLI is unavailable." >&2
                exit 1
              fi

              "$php_binary" artisan migrate --force --no-interaction
            '
